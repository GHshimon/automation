# 毎朝の業界ニュースレポート設定
# パスやモデル名は環境に合わせて編集してください。

language: 日本語

# レポート対象トピック(1トピック = 検索付き1回の API 呼び出し = 課金の主単位)。
# コスト削減のため2分野を1トピックに集約(検索呼び出しを半減)。分野を分けたい/
# 増やしたい場合は topic を追加すればよいが、その分コストは線形に増える。
topics:
  - name: 生成AI業界 と Apple/macOS
    focus: >-
      2分野を扱う。(1)生成AI業界: 主要モデル・API のリリース、価格改定、企業の採用事例、
      X 上で話題の議論。(2)Apple/macOS: macOS・開発者向けツール・自動化関連のアップデートと
      コミュニティの反応。各分野を別々の小見出しに分けて書くこと。

output:
  local_dir: ~/Reports/daily          # ローカル保存先
  rclone_remote: ""  # rclone 未導入のため一旦ローカル保存のみ。導入後 "gdrive:Reports/daily" に戻す

providers:
  # ニュース収集: Grok(web_search + x_search でリアルタイム情報を取得)
  # 非推論モデルを使用: 推論トークンが出ずコストが大幅に下がる(grok-4.5 比 約-70%)。
  # 検索ツールは非推論モデルでも利用可能なことを実測で確認済み。
  news_model: grok-4.20-0309-non-reasoning
  # 統合サマリーなど軽い処理のフォールバック(Ollama が起動していない場合に使用)
  # 非推論モデルで安価・高速。有効なモデル名は `curl https://api.x.ai/v1/models` で確認。
  fast_model: grok-4.20-0309-non-reasoning
  # ローカル LLM(Ollama)。起動していれば統合サマリーはこちらで無料処理
  local_model: llama3.2
  # 週1回の深掘りレポート: Perplexity sonar-deep-research(約$0.3〜1.3/本)
  deep_research:
    enabled: false        # PERPLEXITY_API_KEY を設定したら true に
    weekday: 0            # 0=月曜(この曜日だけ実行)
    model: sonar-deep-research
    query: 生成AI業界の直近1週間の重要動向を、引用付きで包括的にレポートしてください。

# macOS 通知(terminal-notifier がある場合)
# n8n 化に伴い通知は n8n ワークフロー側が担当するため false。
# Python を単体実行する場合に通知が欲しければ true に戻す。
notify: false

# 1回の実行あたりの安全上限
limits:
  max_topics: 5
  max_output_tokens: 3000  # 出力上限を締めてコスト抑制(8000→3000)
